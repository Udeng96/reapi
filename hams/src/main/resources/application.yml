server:
  port: 30002
  servlet:
    context-path: /api

spring:
  # PostgreSQL (도어 이력 등)
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# MariaDB (장비/그룹 마스터)
hams-equip:
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST}:${MARIADB_PORT}/${MARIADB_DB}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${MARIADB_USERNAME}
    password: ${MARIADB_PASSWORD}

hams:
  address: ${HAMS_ADDRESS}
  port: ${HAMS_PORT}
  doe-port: ${HAMS_DOE_PORT}
  id: ${HAMS_ID}
  pw: ${HAMS_PW}
  cryptKey: ${HAMS_CRYPT_KEY}
  isUseCrypt: true
  facClfyId: ${HAMS_FAC_CLFY_ID}
  tcp:
    # 개발 환경에서 장비 연결 없이 구동하려면 false로 변경
    # 운영 환경: true
    enabled: false
