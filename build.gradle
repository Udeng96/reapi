// ============================================================
// 루트 프로젝트: 빌드 설정만 (레거시 Kotlin 코드는 서브모듈 이전 후 삭제 예정)
// 레거시 코드 실행은 기존 pom.xml + mvnw 사용
// ============================================================

// 서브모듈 공통 설정: Java 17
subprojects {
    apply plugin: 'java'

    group = 'com.eseict.reapi'
    version = '0.0.1-SNAPSHOT'

    java {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }

    repositories {
        maven { url 'http://210.97.42.250:5001/repository/public/' ; allowInsecureProtocol = true }
        maven { url 'http://210.97.42.250:5001/repository/maven-central/' ; allowInsecureProtocol = true }
        maven { url 'http://210.97.42.250:5001/repository/maven-public/' ; allowInsecureProtocol = true }
        mavenCentral()
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
